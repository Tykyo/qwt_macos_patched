stages:
  - build
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

default:
  tags:
    - macos

variables:
  GIT_SUBMODULE_STRATEGY: recursive

build:
  stage: build

  parallel:
    matrix:
      - QT_VERSION: ["6.11.1", "6.12.0"]

  script:
    # Install Qt only if it is not already available.
    - |
      if [ ! -d "$QT_INSTALL_ROOT/$QT_VERSION" ]; then
        echo "Installing Qt $QT_VERSION..."
        python3 -m aqt install-qt mac desktop "$QT_VERSION" clang_64 \
          --outputdir "$QT_INSTALL_ROOT"
      else
        echo "Using cached Qt $QT_VERSION"
      fi

    - export QT_ROOT="$QT_INSTALL_ROOT/$QT_VERSION/macos"
    - export PATH="$QT_ROOT/bin:$PATH"

    - mkdir -p build
    - cd build
    - qmake ../qwt_macos_patched.pro "CONFIG+=release" "CONFIG-=debug"
    - make -j"$(sysctl -n hw.ncpu)"

    - cd qwt/lib
    - zip -r -y "qwt-macos-qt${QT_VERSION}.zip" *.framework

  artifacts:
    name: "qwt-macos-qt${QT_VERSION}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build/qwt/lib/*.zip
    expire_in: 30 days

release:
  stage: release

  image: registry.gitlab.com/gitlab-org/cli:latest
  tags:
    - docker

  needs:
    - job: build
      artifacts: true

  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

  script:
    - echo "Creating release ${CI_COMMIT_TAG}"

  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: >
      Builds macOS Qwt generated by GitLab CI.
      The framework ZIP files are available as pipeline artifacts.